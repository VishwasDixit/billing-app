<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Billing</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="shopTitle">Billing</h1>
      <div class="topbar-actions">
        <button id="addItemBtn" class="btn">+ Add Item</button>
        <button id="settingsBtn" class="btn btn-ghost">Settings</button>
      </div>
    </header>

    <main class="layout">
      <section class="menu-panel">
        <div class="menu-tools">
          <input id="search" type="search" placeholder="Search menu…" autocomplete="off">
          <label class="edit-toggle"><input type="checkbox" id="editMode"> Edit menu</label>
        </div>
        <div id="categories" class="chips"></div>
        <div id="menuGrid" class="menu-grid"></div>
      </section>

      <aside class="cart-panel">
        <div class="cart-head">
          <h2>Cart</h2>
          <button id="clearCart" class="btn btn-ghost btn-sm">Clear</button>
        </div>
        <div id="cartList" class="cart-list"></div>

        <div class="discount-row">
          <label>Discount</label>
          <input id="discountValue" type="number" min="0" step="0.01" value="0" inputmode="decimal">
          <select id="discountType">
            <option value="percent">%</option>
            <option value="flat">Flat</option>
          </select>
        </div>

        <div class="totals" id="totals"></div>

        <div id="printerBar" class="printer-bar">
          <span id="printerStatus">Printer: not connected</span>
          <button id="connectBtn" class="btn btn-sm">Connect</button>
        </div>
        <button id="printBtn" class="btn btn-primary btn-lg">Print Bill</button>
      </aside>
    </main>
  </div>

  <!-- Item add/edit dialog -->
  <dialog id="itemDialog">
    <form method="dialog" id="itemForm">
      <h3 id="itemDialogTitle">Add Item</h3>
      <label>Name <input name="name" required maxlength="40"></label>
      <label>Price <input name="price" type="number" min="0" step="0.01" required inputmode="decimal"></label>
      <label>Category <input name="category" list="categoryList" maxlength="24" placeholder="optional"></label>
      <datalist id="categoryList"></datalist>
      <div class="dialog-actions">
        <button type="button" id="deleteItemBtn" class="btn btn-danger">Delete</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="btn btn-ghost">Cancel</button>
        <button value="save" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Settings dialog -->
  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h3>Settings</h3>
      <label>Shop name <input name="shopName" maxlength="32"></label>
      <label>Address <textarea name="address" rows="2" maxlength="120"></textarea></label>
      <label>Phone <input name="phone" maxlength="20"></label>
      <label>GSTIN <input name="gstin" maxlength="20" placeholder="optional"></label>
      <div class="row2">
        <label>Currency symbol <input name="currency" maxlength="4"></label>
        <label>GST % <input name="gstPercent" type="number" min="0" step="0.01"></label>
      </div>
      <label>Bill footer <input name="footer" maxlength="60"></label>
      <label>Next bill no. <input name="billNo" type="number" min="1" step="1"></label>

      <h4>Printer</h4>
      <label>Print method
        <select name="printMethod">
          <option value="bluetooth">Bluetooth printer (Chrome, Android/Mac)</option>
          <option value="rawbt">RawBT app (Android)</option>
          <option value="serial">Bluetooth serial (Chrome, Mac/PC)</option>
          <option value="browser">Browser print dialog (installed printer)</option>
        </select>
      </label>
      <div class="row2">
        <label>Characters per line <input name="charsPerLine" type="number" min="16" max="64" step="1"></label>
        <label class="check"><input name="cutPaper" type="checkbox"> Cut paper</label>
      </div>
      <div class="row2">
        <label class="check"><input name="largeText" type="checkbox"> Large shop name &amp; total</label>
        <label class="check"><input name="slowMode" type="checkbox"> Slow mode</label>
      </div>
      <div class="row2">
        <button type="button" id="testPrintBtn" class="btn">Test print</button>
        <button type="button" id="diagBtn" class="btn">Diagnose printer</button>
      </div>

      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="btn btn-ghost">Cancel</button>
        <button value="save" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Printer diagnostics -->
  <dialog id="diagDialog">
    <form method="dialog">
      <h3>Printer diagnostics</h3>
      <p class="diag-help">Close Bill Sarthy first. Connect, then press <b>Send Hello</b> on each writable channel.
        Pick <b>Use this</b> on the one that prints “Hello”.</p>
      <div id="diagStatus" class="diag-status">No printer connected.</div>
      <button type="button" id="diagConnect" class="btn btn-primary">Connect printer</button>
      <div id="diagChannels" class="diag-channels"></div>
      <pre id="diagLog" class="diag-log"></pre>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button value="close" class="btn btn-ghost">Close</button>
      </div>
    </form>
  </dialog>

  <!-- Printed only -->
  <div id="receipt"></div>

  <script src="escpos.js"></script>
  <script src="app.js"></script>
</body>
</html>
